default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: npm-lint
        name: ESLint
        entry: npm run lint
        language: system
        stages: [commit]
        pass_filenames: false
        always_run: true

      - id: npm-type-check
        name: TypeScript type-check
        entry: npm run type:check
        language: system
        stages: [commit]
        pass_filenames: false
        always_run: true

      - id: npm-format
        name: Prettier format check
        entry: npm run format:check
        language: system
        stages: [commit]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: cargo-audit
        name: cargo-audit (Rust dependencies)
        entry: bash -c 'if [ -d contracts ]; then cargo audit --deny warnings; fi'
        language: system
        files: ^contracts/(.*/)?(Cargo.toml|Cargo.lock)$
        stages: [commit]
        pass_filenames: false