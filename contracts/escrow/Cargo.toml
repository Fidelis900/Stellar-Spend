[package]
name = "escrow"
version = "1.0.0"
edition = "2021"
rust-version = "1.81"

[dependencies]
soroban-sdk = "20"
stellar-spend-shared = { path = "../shared" }

[features]
# `#[contractimpl]` only emits the `ContractFunctionSet` impl that `register_contract`
# needs when this feature is on. Unit tests in src/ get it via cfg(test); integration
# tests in tests/ link the crate as a normal dependency and need the feature explicitly.
testutils = ["soroban-sdk/testutils"]

[dev-dependencies]
# `testutils` provides Address::generate, Ledger::with_mut and the auth mocking the
# unauthorized-call tests rely on.
soroban-sdk = { version = "20", features = ["testutils"] }
escrow = { path = ".", features = ["testutils"] }

[lib]
# `rlib` in addition to `cdylib` is what lets tests/ and the fuzz harness link this
# crate; with `cdylib` alone `use escrow::…` from tests/ does not resolve.
crate-type = ["cdylib", "rlib"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
overflow-checks = true
