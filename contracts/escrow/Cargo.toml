[package]
name = "escrow"
version = "1.0.0"
edition = "2021"

[dependencies]
soroban-sdk = "20"
stellar-spend-shared = { path = "../shared" }

[lib]
crate-type = ["cdylib"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
overflow-checks = true
